[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-ml"
version = "0.1.0"
description = "Projeto didático de ML para detecção de anomalias em telemetria sintética."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "mlflow>=3.0",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
